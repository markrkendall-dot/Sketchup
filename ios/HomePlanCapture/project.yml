# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). Optional: the checked-in
# HomePlanCapture.xcodeproj is meant to open as it is. If it does not, run
#   brew install xcodegen
#   cd ios/HomePlanCapture && xcodegen generate
# which rewrites HomePlanCapture.xcodeproj from this file.
name: HomePlanCapture
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HomePlanCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: HomePlanCapture
        PRODUCT_BUNDLE_IDENTIFIER: com.example.homeplancapture
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The mesh colouring loop is slow without optimisation, and Xcode's Run uses Debug.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
